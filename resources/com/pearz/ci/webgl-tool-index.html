<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{PRODUCT_NAME}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #c9ced8; }
  /* Trang khung của game có web-tool. Game là một site riêng (Jenkins deploy), nằm trong iframe; panel của game
     (thư mục WebTool) nằm cạnh nó. Màn dọc hoặc hẹp thì panel ẩn và trang chỉ còn khung game 9:16 căn giữa. */
  #frame { position: relative; aspect-ratio: {{WIDTH}} / {{HEIGHT}}; height: min(100dvh, calc(100vw * {{HEIGHT}} / {{WIDTH}})); background: #222632; }
  #game { display: block; width: 100%; height: 100%; border: 0; }
  #tool-panel { display: none; }
  @media (min-aspect-ratio: 1/1) and (min-width: 900px) {
    body { align-items: stretch; justify-content: flex-start; }
    #frame { flex: none; height: 100dvh; }
    #tool-panel { display: block; flex: 1; min-width: 0; height: 100dvh; box-sizing: border-box; overflow: auto; border-left: 1px solid #3a3f4d; }
  }
</style>
{{TOOL_HEAD}}
</head>
<body>
<div id="frame"></div>
<aside id="tool-panel">
{{TOOL_PANEL}}
</aside>
<script>
  // API cho tool.js của game. Game chạy ở origin khác nên mọi thứ đi qua postMessage; dữ liệu là chuỗi do game
  // tự quy ước, trang không đọc nội dung.
  var gameUrl = {{GAME_URL_JSON}};
  var gameOrigin = new URL(gameUrl).origin;
  var gameFrame = document.createElement("iframe");
  var gameReady, gameFailed, toolListeners = {};
  function postToGame(message) {
    message.pearzTool = 1;
    gameFrame.contentWindow.postMessage(message, gameOrigin);
  }
  var pearzTool = window.pearzTool = {
    // Xong khi Unity nạp xong; bị từ chối nếu game không nạp được.
    ready: new Promise(function (resolve, reject) { gameReady = resolve; gameFailed = reject; }),
    // Gọi một method của GameObject trong scene. Object/mảng thành chuỗi JSON; bỏ trống data thì gọi không tham số.
    // Gọi trước khi game nạp xong thì tự chờ.
    send: function (objectName, methodName, data) {
      return pearzTool.ready.then(function () {
        postToGame({ type: "send", object: objectName, method: methodName, data: data });
      });
    },
    // Gửi một tin tới PearzTool.On(channel, ...) trong C# của game (component có sẵn trong PearzCI).
    post: function (channel, data) {
      return pearzTool.send("PearzTool", "Receive", {
        channel: channel,
        data: data === undefined ? "" : typeof data === "string" ? data : JSON.stringify(data)
      });
    },
    // Tải một file về máy. Object/mảng được ghi thành JSON thụt lề.
    saveFile: function (name, data) {
      var text = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      var link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: /\.json$/i.test(name) ? "application/json" : "text/plain" }));
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
    },
    // Mở hộp chọn file; trả về { name, text }, hoặc null nếu người dùng huỷ.
    openFile: function (accept) {
      return new Promise(function (resolve, reject) {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = accept || ".json,application/json";
        input.onchange = function () {
          var file = input.files[0];
          if (!file) return resolve(null);
          file.text().then(function (text) { resolve({ name: file.name, text: text }); }, reject);
        };
        input.oncancel = function () { resolve(null); };
        input.click();
      });
    },
    // Game báo ra panel: C# gọi PearzTool.Emit(event, data), tool.js nghe bằng pearzTool.on.
    // on trả về hàm huỷ đăng ký.
    on: function (event, listener) {
      (toolListeners[event] = toolListeners[event] || []).push(listener);
      return function () {
        toolListeners[event] = toolListeners[event].filter(function (l) { return l !== listener; });
      };
    },
    emit: function (event, data) {
      (toolListeners[event] || []).forEach(function (listener) {
        try { listener(data); } catch (error) { console.error(error); }
      });
    }
  };
  // Trang không có tool.js thì không ai bắt lỗi của ready.
  pearzTool.ready.catch(function () {});

  // Kho level của dự án (webtool-worker.mjs, bật bằng "levels" trong WebTool/pearz-tool.json). Kho không hiểu nội
  // dung level: game tự quy ước dữ liệu và "meta" (giá trị JSON nhỏ hiện trong danh mục). Lỗi ném ra có .code:
  // "login" (chưa đăng nhập), "conflict" (người khác đã sửa, .revision là bản hiện tại), "notfound", "unavailable"…
  function levelError(code, message, extra) {
    var error = new Error(message || code);
    error.code = code;
    if (extra && extra.revision !== undefined) error.revision = extra.revision;
    return error;
  }
  function levelRequest(method, path, headers, body) {
    return fetch(path, {
      method: method,
      // X-Pearz-Tool là điều kiện API đặt ra cho mọi lệnh ghi; redirect "manual" để nhận ra trang đăng nhập
      // của Cloudflare Access thay vì đi theo nó.
      headers: Object.assign({ "X-Pearz-Tool": "1" }, headers),
      body: body,
      cache: "no-store",
      credentials: "same-origin",
      redirect: "manual"
    }).then(function (response) {
      if (response.type === "opaqueredirect") throw levelError("login", "Sign in to edit levels.");
      if (response.ok) return response;
      return response.text().then(function (text) {
        var info = {};
        try { info = JSON.parse(text); } catch (error) { /* trang lỗi không phải JSON */ }
        throw levelError(info.error || (response.status === 404 ? "unavailable" : "http" + response.status),
          info.message || "The level store answered " + response.status + ".", info);
      });
    });
  }
  function levelBody(data, contentType) {
    if (typeof data === "string") return { body: data, type: contentType || "text/plain; charset=utf-8" };
    if (data instanceof Blob || data instanceof ArrayBuffer || ArrayBuffer.isView(data))
      return { body: data, type: contentType || data.type || "application/octet-stream" };
    return { body: JSON.stringify(data), type: contentType || "application/json" };
  }
  function levelPath(id) { return "/api/edit/levels/" + encodeURIComponent(id); }
  function levelJson(response) { return response.json(); }
  pearzTool.levels = {
    // { version, levels: [{ id, revision, enabled, meta, size, contentType, updatedAt }] } theo thứ tự chơi.
    // editing: true (cần đăng nhập) thêm updatedBy và cả level đã xoá (deleted: true).
    list: function (options) {
      return levelRequest("GET", options && options.editing ? "/api/edit/levels" : "/api/levels").then(levelJson);
    },
    // { id, revision, meta, contentType, data }. options.as: "text" (mặc định) | "json" | "bytes" (Uint8Array);
    // options.revision lấy một bản cũ trong lịch sử.
    get: function (id, options) {
      options = options || {};
      var query = options.revision ? "?revision=" + encodeURIComponent(options.revision) : "";
      return levelRequest("GET", "/api/levels/" + encodeURIComponent(id) + query).then(function (response) {
        var read = options.as === "json" ? response.json()
          : options.as === "bytes" ? response.arrayBuffer().then(function (buffer) { return new Uint8Array(buffer); })
          : response.text();
        return read.then(function (data) {
          var meta = null;
          try { meta = JSON.parse(decodeURIComponent(response.headers.get("X-Pearz-Meta") || "null")); } catch (error) { /* giữ null */ }
          return {
            id: id,
            revision: Number(response.headers.get("X-Pearz-Revision")),
            meta: meta,
            contentType: response.headers.get("Content-Type"),
            data: data
          };
        });
      });
    },
    // Lưu một level; trả { id, revision }. options.revision là bản đang sửa (bỏ trống = tạo mới); kho từ chối với
    // code "conflict" nếu level đã bị người khác đổi. data: chuỗi, object (ghi thành JSON), ArrayBuffer/TypedArray/Blob.
    // options.meta: giá trị JSON cho danh mục; bỏ trống khi sửa thì giữ meta cũ.
    save: function (id, data, options) {
      options = options || {};
      var content = levelBody(data, options.contentType);
      var headers = { "Content-Type": content.type };
      if (options.revision) headers["If-Match"] = '"' + options.revision + '"';
      else headers["If-None-Match"] = "*";
      if (options.meta !== undefined) headers["X-Pearz-Meta"] = encodeURIComponent(JSON.stringify(options.meta));
      return levelRequest("PUT", levelPath(id), headers, content.body).then(levelJson);
    },
    // Đổi enabled / meta mà không tạo revision mới: changes = { enabled?, meta? }.
    update: function (id, changes) {
      return levelRequest("PATCH", levelPath(id), { "Content-Type": "application/json" }, JSON.stringify(changes)).then(levelJson);
    },
    // Xoá mềm (lịch sử còn, restore lấy lại được). revision là bản đang thấy.
    remove: function (id, revision) {
      return levelRequest("DELETE", levelPath(id), { "If-Match": '"' + revision + '"' }).then(levelJson);
    },
    // Xếp lại thứ tự chơi theo mảng id.
    reorder: function (ids) {
      return levelRequest("PUT", "/api/edit/order", { "Content-Type": "application/json" }, JSON.stringify({ ids: ids })).then(levelJson);
    },
    // { id, revisions: [{ revision, size, savedAt, savedBy }] }, mới nhất trước.
    history: function (id) {
      return levelRequest("GET", levelPath(id) + "/revisions").then(levelJson);
    },
    // Tạo revision mới mang nội dung của một bản cũ; cũng lấy lại level đã xoá.
    restore: function (id, revision) {
      return levelRequest("POST", levelPath(id) + "/restore", { "Content-Type": "application/json" },
        JSON.stringify({ revision: revision })).then(levelJson);
    },
    // { email } của người đang đăng nhập, hoặc null.
    me: function () {
      return levelRequest("GET", "/api/edit/me").then(levelJson, function (error) {
        if (error.code === "login") return null;
        throw error;
      });
    },
    // Mở cửa sổ đăng nhập Cloudflare Access; gọi từ một cú click (trình duyệt chặn popup tự mở). Xong trả
    // { email }, hoặc null nếu không đăng nhập (đóng cửa sổ giữa chừng thì có thể mất tới hai phút mới trả null).
    // Popup bị chặn thì chuyển cả trang sang đăng nhập rồi quay lại.
    login: function () {
      var popup = window.open("/api/edit/login", "pearz-login", "width=520,height=680");
      if (!popup) {
        location.href = "/api/edit/login?return=" + encodeURIComponent(location.pathname + location.search);
        return new Promise(function () {});
      }
      return new Promise(function (resolve) {
        var channel = null, giveUp = null;
        try { channel = new BroadcastChannel("pearz-login"); } catch (error) { /* trình duyệt cũ: còn postMessage */ }
        function isDone(data) { return data && data.pearzTool === 1 && data.type === "login"; }
        function onMessage(event) { if (event.origin === location.origin && isDone(event.data)) finish(); }
        function finish(result) {
          clearInterval(timer);
          clearTimeout(giveUp);
          window.removeEventListener("message", onMessage);
          if (channel) channel.close();
          resolve(result === undefined ? pearzTool.levels.me() : result);
        }
        // Trang đăng nhập của Access có thể làm popup trông như đã đóng dù người dùng còn đang nhập mã: thấy
        // "đã đóng" mà chưa đăng nhập thì vẫn chờ tin báo xong thêm một lúc rồi mới coi là huỷ.
        var timer = setInterval(function () {
          if (!popup.closed) return;
          clearInterval(timer);
          pearzTool.levels.me().then(function (user) {
            if (user) finish(user);
            else giveUp = setTimeout(function () { finish(null); }, 120000);
          }, function () { finish(null); });
        }, 500);
        window.addEventListener("message", onMessage);
        if (channel) channel.onmessage = function (event) { if (isDone(event.data)) finish(); };
      });
    }
  };

  window.addEventListener("message", function (event) {
    var message = event.data;
    if (event.source !== gameFrame.contentWindow || event.origin !== gameOrigin) return;
    if (!message || message.pearzTool !== 1) return;
    if (message.type === "state") {
      if (message.state === "ready") gameReady();
      else if (message.state === "failed") gameFailed(new Error(message.error || "Could not load the game."));
    } else if (message.type === "emit" && typeof message.event === "string") {
      pearzTool.emit(message.event, message.data);
    }
  });
  // Trang game chỉ trả lời sau khi nhận "hello", nên gửi lại mỗi lần iframe nạp xong.
  gameFrame.addEventListener("load", function () { postToGame({ type: "hello" }); });
  gameFrame.id = "game";
  gameFrame.title = {{PRODUCT_NAME_JSON}};
  gameFrame.allow = "autoplay; fullscreen; gamepad; clipboard-read; clipboard-write";
  gameFrame.src = gameUrl;
  document.getElementById("frame").appendChild(gameFrame);
</script>
{{TOOL_SCRIPT}}
</body>
</html>
