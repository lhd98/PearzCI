<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{PRODUCT_NAME}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #c9ced8; }
  /* Trang khung của game có web-tool. Game là một site riêng (Jenkins deploy), nằm trong iframe; panel của game
     (thư mục WebTool) nằm cạnh nó. Màn dọc hoặc hẹp thì panel ẩn và trang chỉ còn khung game 9:16 căn giữa. */
  #frame { position: relative; aspect-ratio: {{WIDTH}} / {{HEIGHT}}; height: min(100dvh, calc(100vw * {{HEIGHT}} / {{WIDTH}})); background: #222632; }
  #game { display: block; width: 100%; height: 100%; border: 0; }
  #tool-panel { display: none; }
  @media (min-aspect-ratio: 1/1) and (min-width: 900px) {
    body { align-items: stretch; justify-content: flex-start; }
    #frame { flex: none; height: 100dvh; }
    #tool-panel { display: block; flex: 1; min-width: 0; height: 100dvh; box-sizing: border-box; overflow: auto; border-left: 1px solid #3a3f4d; }
  }
</style>
{{TOOL_HEAD}}
</head>
<body>
<div id="frame"></div>
<aside id="tool-panel">
{{TOOL_PANEL}}
</aside>
<script>
  // API cho tool.js của game. Game chạy ở origin khác nên mọi thứ đi qua postMessage; dữ liệu là chuỗi do game
  // tự quy ước, trang không đọc nội dung.
  var gameUrl = {{GAME_URL_JSON}};
  var gameOrigin = new URL(gameUrl).origin;
  var gameFrame = document.createElement("iframe");
  var gameReady, gameFailed, toolListeners = {};
  function postToGame(message) {
    message.pearzTool = 1;
    gameFrame.contentWindow.postMessage(message, gameOrigin);
  }
  var pearzTool = window.pearzTool = {
    // Xong khi Unity nạp xong; bị từ chối nếu game không nạp được.
    ready: new Promise(function (resolve, reject) { gameReady = resolve; gameFailed = reject; }),
    // Gọi một method của GameObject trong scene. Object/mảng thành chuỗi JSON; bỏ trống data thì gọi không tham số.
    // Gọi trước khi game nạp xong thì tự chờ.
    send: function (objectName, methodName, data) {
      return pearzTool.ready.then(function () {
        postToGame({ type: "send", object: objectName, method: methodName, data: data });
      });
    },
    // Gửi một tin tới PearzTool.On(channel, ...) trong C# của game (component có sẵn trong PearzCI).
    post: function (channel, data) {
      return pearzTool.send("PearzTool", "Receive", {
        channel: channel,
        data: data === undefined ? "" : typeof data === "string" ? data : JSON.stringify(data)
      });
    },
    // Tải một file về máy. Object/mảng được ghi thành JSON thụt lề.
    saveFile: function (name, data) {
      var text = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      var link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: /\.json$/i.test(name) ? "application/json" : "text/plain" }));
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
    },
    // Mở hộp chọn file; trả về { name, text }, hoặc null nếu người dùng huỷ.
    openFile: function (accept) {
      return new Promise(function (resolve, reject) {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = accept || ".json,application/json";
        input.onchange = function () {
          var file = input.files[0];
          if (!file) return resolve(null);
          file.text().then(function (text) { resolve({ name: file.name, text: text }); }, reject);
        };
        input.oncancel = function () { resolve(null); };
        input.click();
      });
    },
    // Game báo ra panel: C# gọi PearzTool.Emit(event, data), tool.js nghe bằng pearzTool.on.
    // on trả về hàm huỷ đăng ký.
    on: function (event, listener) {
      (toolListeners[event] = toolListeners[event] || []).push(listener);
      return function () {
        toolListeners[event] = toolListeners[event].filter(function (l) { return l !== listener; });
      };
    },
    emit: function (event, data) {
      (toolListeners[event] || []).forEach(function (listener) {
        try { listener(data); } catch (error) { console.error(error); }
      });
    }
  };
  // Trang không có tool.js thì không ai bắt lỗi của ready.
  pearzTool.ready.catch(function () {});

  window.addEventListener("message", function (event) {
    var message = event.data;
    if (event.source !== gameFrame.contentWindow || event.origin !== gameOrigin) return;
    if (!message || message.pearzTool !== 1) return;
    if (message.type === "state") {
      if (message.state === "ready") gameReady();
      else if (message.state === "failed") gameFailed(new Error(message.error || "Could not load the game."));
    } else if (message.type === "emit" && typeof message.event === "string") {
      pearzTool.emit(message.event, message.data);
    }
  });
  // Trang game chỉ trả lời sau khi nhận "hello", nên gửi lại mỗi lần iframe nạp xong.
  gameFrame.addEventListener("load", function () { postToGame({ type: "hello" }); });
  gameFrame.id = "game";
  gameFrame.title = {{PRODUCT_NAME_JSON}};
  gameFrame.allow = "autoplay; fullscreen; gamepad; clipboard-read; clipboard-write";
  gameFrame.src = gameUrl;
  document.getElementById("frame").appendChild(gameFrame);
</script>
{{TOOL_SCRIPT}}
</body>
</html>
