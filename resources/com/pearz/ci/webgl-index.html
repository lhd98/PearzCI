<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{PRODUCT_NAME}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #c9ced8; }
  /* Khung luôn 9:16 và vừa khít màn hình; độ phân giải render nằm ở canvas.width/height. */
  #frame { position: relative; aspect-ratio: {{WIDTH}} / {{HEIGHT}}; height: min(100dvh, calc(100vw * {{HEIGHT}} / {{WIDTH}})); background: #222632; }
  #unity-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #loading h1 { margin: 0; font-size: 28px; color: #e8ebf1; }
  #bar { width: 60%; height: 6px; border-radius: 3px; background: #3a3f4d; overflow: hidden; }
  #bar > div { width: 0; height: 100%; background: #e8ebf1; transition: width .2s; }
  #error { display: none; max-width: 80%; text-align: center; color: #ff8a80; }
  #version { position: absolute; right: 6px; bottom: 4px; font-size: 11px; opacity: .45; pointer-events: none; }
  /* Layout tool (body.tool, game có thư mục WebTool): khung game căn trái cao hết màn, panel của game chiếm phần còn lại.
     Màn dọc hoặc hẹp thì panel ẩn và trang trở về khung 9:16 căn giữa ở trên. */
  #tool-panel { display: none; }
  @media (min-aspect-ratio: 1/1) and (min-width: 900px) {
    body.tool { align-items: stretch; justify-content: flex-start; }
    body.tool #frame { flex: none; height: 100dvh; }
    body.tool #tool-panel { display: block; flex: 1; min-width: 0; height: 100dvh; box-sizing: border-box; overflow: auto; border-left: 1px solid #3a3f4d; }
  }
</style>
{{TOOL_HEAD}}
</head>
<body class="{{BODY_CLASS}}">
<div id="frame">
  <canvas id="unity-canvas" width="{{WIDTH}}" height="{{HEIGHT}}" tabindex="-1"></canvas>
  <div id="loading">
    <h1>{{PRODUCT_NAME}}</h1>
    <div id="bar"><div></div></div>
    <div id="error"></div>
  </div>
  <div id="version">{{VERSION}}</div>
</div>
{{TOOL_PANEL}}
<script>
  var buildQuery = "?v={{BUILD_ID}}";
  var canvas = document.getElementById("unity-canvas");
  var loading = document.getElementById("loading");
  var barFill = document.querySelector("#bar > div");
  var errorBox = document.getElementById("error");
  var config = {
    dataUrl: "Build/{{DATA}}" + buildQuery,
    frameworkUrl: "Build/{{FRAMEWORK}}" + buildQuery,
    codeUrl: "Build/{{WASM}}" + buildQuery,
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{COMPANY_NAME_JSON}},
    productName: {{PRODUCT_NAME_JSON}},
    productVersion: {{VERSION_JSON}},
    // Giữ đúng độ phân giải đã chọn trong Jenkins thay vì theo kích thước CSS.
    matchWebGLToCanvasSize: false,
    devicePixelRatio: 1
  };
  // API cho tool.js của game (thư mục WebTool). Dữ liệu đi qua là chuỗi do game tự quy ước; trang không đọc nội dung.
  var unityReady, unityFailed, toolListeners = {};
  var pearzTool = window.pearzTool = {
    // Xong khi Unity nạp xong (trả về unityInstance); bị từ chối nếu game không nạp được.
    ready: new Promise(function (resolve, reject) { unityReady = resolve; unityFailed = reject; }),
    // Gọi một method của GameObject trong scene. Object/mảng thành chuỗi JSON; bỏ trống data thì gọi không tham số.
    // Gọi trước khi game nạp xong thì tự chờ.
    send: function (objectName, methodName, data) {
      return pearzTool.ready.then(function (unity) {
        if (data === undefined) unity.SendMessage(objectName, methodName);
        else unity.SendMessage(objectName, methodName,
          typeof data === "string" || typeof data === "number" ? data : JSON.stringify(data));
      });
    },
    // Tải một file về máy. Object/mảng được ghi thành JSON thụt lề.
    saveFile: function (name, data) {
      var text = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      var link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: /\.json$/i.test(name) ? "application/json" : "text/plain" }));
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
    },
    // Mở hộp chọn file; trả về { name, text }, hoặc null nếu người dùng huỷ.
    openFile: function (accept) {
      return new Promise(function (resolve, reject) {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = accept || ".json,application/json";
        input.onchange = function () {
          var file = input.files[0];
          if (!file) return resolve(null);
          file.text().then(function (text) { resolve({ name: file.name, text: text }); }, reject);
        };
        input.oncancel = function () { resolve(null); };
        input.click();
      });
    },
    // Game báo ra panel: .jslib của game gọi pearzTool.emit(event, data), tool.js nghe bằng pearzTool.on.
    // on trả về hàm huỷ đăng ký.
    on: function (event, listener) {
      (toolListeners[event] = toolListeners[event] || []).push(listener);
      return function () {
        toolListeners[event] = toolListeners[event].filter(function (l) { return l !== listener; });
      };
    },
    emit: function (event, data) {
      (toolListeners[event] || []).forEach(function (listener) {
        try { listener(data); } catch (error) { console.error(error); }
      });
    }
  };
  // Trang không có tool.js thì không ai bắt lỗi của ready.
  pearzTool.ready.catch(function () {});

  var script = document.createElement("script");
  script.src = "Build/{{LOADER}}" + buildQuery;
  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      barFill.style.width = Math.round(progress * 100) + "%";
    }).then(function (unityInstance) {
      loading.style.display = "none";
      unityReady(unityInstance);
    }).catch(function (message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      unityFailed(new Error(message));
    });
  };
  script.onerror = function () {
    errorBox.textContent = "Could not load the game. Reload the page.";
    errorBox.style.display = "block";
    unityFailed(new Error("Could not load the game."));
  };
  document.body.appendChild(script);
</script>
{{TOOL_SCRIPT}}
</body>
</html>
